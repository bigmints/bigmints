id: xtara
title: xTara
description: A learner-owned career navigation product that turns assessment signals into Career Directions, Dream Careers, and small Learn–Try–Discuss steps without treating a score as destiny.
category: Product
tags:
  - Career Navigation
  - Learner Agency
  - EdTech
  - Multilingual UX
imageUrl: /xtara-cover.jpg
logoUrl: /xtara-logo.png
link: https://www.xtara.ai/
featured: true
date: "2024–2026"
status: Active development
role: Product Strategy, Architecture & UX Lead
platform: Web, iOS & Android

overview:
  - xTara helps learners understand themselves, explore credible options, compare possible routes, and decide what to do next. It is designed as an ongoing navigation system rather than a one-time test that declares a permanent answer.
  - Learners move from assessment signals to a Career Direction, select a small set of Dream Careers, and build evidence by learning, trying activities, discussing options with trusted people, and revising the path over time.
  - The product supports English, Malayalam, and Hindi journeys, a structured career and college catalogue, and consent-aware institution participation while keeping the learner's account and decisions their own.

objectives:
  - Give learners understandable career areas worth exploring
  - Replace unexplained fit scores with reasons and useful next actions
  - Connect career exploration to subjects, courses, institutions, and real-world activities
  - Let schools support guidance without owning or ranking the learner

keyFeatures:
  - "Career Direction: Plain-language areas derived from assessment signals, presented as choices to explore rather than verdicts."
  - "Dream Careers: Learners choose a focused set of possibilities and can revise them as they gain evidence."
  - "Learn, Try, Discuss: Small activities, content, and conversation guides turn an abstract career choice into something testable."
  - "Career Path: Subjects, skills, courses, and institutions are organized into a path the learner can review over time."
  - "Multilingual experience: Core learner journeys and career knowledge support English, Malayalam, and Hindi."
  - "Consent-aware institutions: Educators receive scoped guidance views without raw answers, learner ranking, or ownership of the account."

outcomes:
  - Redesigned assessment discovery around plain explanations, learner choice, and progressive disclosure
  - Built shared web and API career catalogues with structured source and publication boundaries
  - Added multilingual learner journeys and localized career knowledge
  - Designed institution guidance around consent, role scope, and privacy-thresholded cohort insights
