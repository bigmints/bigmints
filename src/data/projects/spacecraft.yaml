id: spacecraft
title: Spacecraft
description: An AI prototyping workspace that turns product briefs, user flows, and Figma design systems into editable React interfaces on a visual canvas.
category: AI
tags:
  - AI Prototyping
  - Design Systems
  - Figma Integration
  - React Generation
imageUrl: /spacecraft-cover.jpg
logoUrl: /spacecraft-logo.png
link: https://app.getautom8.ae/
featured: true
date: "2025–2026"
status: Private pilot
role: Product Architect, Lead Designer & Engineer
platform: Web & Desktop

overview:
  - Spacecraft is the product engineering workspace behind AutoM8. It connects the brief, user flow, design system, generated interface, and live prototype so teams can move from intent to something testable without losing context between tools.
  - A visual flow canvas represents screens, decisions, and input/output states. Generated React interfaces render inside the workspace, remain editable, and preserve navigation, undo, autosave, and preview behavior.
  - Figma imports, approved Shadcn blocks, project documents, skills, and managed model routing give the generation pipeline specific design and product context before a model creates a screen.

objectives:
  - Keep product intent, user-flow logic, design rules, and prototypes together
  - Generate interfaces from approved systems instead of generic visual guesses
  - Make generated flows directly editable and testable by product teams
  - Support managed cloud models, local models, and organization-level usage controls

keyFeatures:
  - "Visual flow workspace: Create, connect, move, select, and edit screen, condition, and input/output nodes."
  - "Design-system generation: Figma variables, approved components, and theme tokens guide generated React interfaces."
  - "Live prototypes: Generated JSX renders inside isolated responsive frames with navigation and interaction support."
  - "Context engine: Product briefs, stories, API references, knowledge, and skills become generation context."
  - "Managed inference: Platform-controlled model routing, usage metering, credits, and provider boundaries support teams."
  - "Web and desktop delivery: The same workspace runs as a hosted application and an Electron desktop product."

outcomes:
  - Built an end-to-end generation pipeline from user-flow analysis through render auditing and repair
  - Replaced static flow rendering with an editable FlowGram canvas and canonical persisted graph
  - Added Figma design-system ingestion, reusable UI blocks, project knowledge, and live preview handoff
  - Delivered platform administration, managed model routing, organization controls, and Cloud Run deployment workflows
